name: BAYAN Deploy

on:
  workflow_run:
    workflows: ["BAYAN CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bayan-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify deployment source is current main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.workflow_run.head_sha || github.sha }}"
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$target" == "$current" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Deployment source $target is the current main commit."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI deployment: tested $target, current main is $current."
          fi
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are not configured; deployment is skipped safely."
          fi

      - name: Report deployment decision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.source.outputs.current }}" != "true" ]]; then
            echo "Stale CI result detected; this deployment run is intentionally skipped because main advanced."
            exit 0
          fi
          if [[ "${{ steps.credentials.outputs.configured }}" != "true" ]]; then
            echo "Cloudflare deployment credentials are not configured; deployment is intentionally skipped."
            exit 0
          fi
          echo "Deployment preconditions satisfied."
      - name: Apply D1 migrations
        if: steps.credentials.outputs.configured == 'true' && steps.source.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: d1 migrations apply bayan-knowledge --remote

      - name: Deploy Worker
        if: steps.credentials.outputs.configured == 'true' && steps.source.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy --strict --var BAYAN_COMMIT_SHA:${{ github.event.workflow_run.head_sha || github.sha }} --var BAYAN_VERSION:0.9.0 --var BAYAN_ENVIRONMENT:production

      - name: Production smoke test
        if: steps.credentials.outputs.configured == 'true' && steps.source.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-smoke.mjs

      - name: BAYAN AI capability benchmark
        if: steps.credentials.outputs.configured == 'true' && steps.source.outputs.current == 'true'
        continue-on-error: true
        shell: bash
        env:
          BAYAN_BASE_URL: https://bayan.tahaomar411.workers.dev
        run: |
          set -euo pipefail
          node scripts/ai-capability-smoke.mjs
