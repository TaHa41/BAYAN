name: BAYAN Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are not configured; deployment is skipped safely."
          fi

      - name: Apply D1 migrations
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations apply bayan-knowledge --remote

      - name: Deploy Worker
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --strict --var BAYAN_COMMIT_SHA:${{ github.sha }} --var BAYAN_VERSION:0.5.0 --var BAYAN_ENVIRONMENT:production

      - name: Production smoke test
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-smoke.mjs

      - name: BAYAN AI capability benchmark
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        env:
          BAYAN_BASE_URL: https://bayan.tahaomar411.workers.dev
        run: |
          set -euo pipefail
          node scripts/ai-capability-smoke.mjs
