name: BAYAN v2 CI
on:
  push:
    branches: ["main","rebuild/v2-from-scratch"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run guards
      - name: Typecheck with diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false --noErrorTruncation 2>&1 | tee typecheck.txt
          status=${PIPESTATUS[0]}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf '### BAYAN v2 TypeScript diagnostics\\n\\n\\`\\`\\`text\\n%s\\n\\`\\`\\`' "$(cat typecheck.txt)")" || true
          fi
          exit "$status"
      - run: node --check public/app.js
      - run: npm test
      - run: npm run build
