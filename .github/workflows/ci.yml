name: BAYAN CI
on:
  push:
    branches: ["rebuild/bayan-from-zero"]
  pull_request:
    branches: ["main"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --check public/app.js
      - run: npm run build
