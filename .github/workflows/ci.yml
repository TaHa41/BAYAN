name: BAYAN v2 CI
on:
  push:
    branches: ["main","rebuild/v2-from-scratch"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Static architecture guards
        run: npm run guards
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend syntax
        run: node --check public/app.js
      - name: Unit tests
        run: npm test
      - name: Wrangler dry build
        run: npm run build
