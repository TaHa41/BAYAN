name: BAYAN v1 CI
on:
  push:
    branches: [v1,main,bayan-v1-knowledge-redesign]
  pull_request:
    branches: [v1,main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
