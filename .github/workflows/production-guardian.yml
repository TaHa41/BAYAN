name: BAYAN post-deploy production guardian
on:
  workflow_run:
    workflows: ["BAYAN production direct deploy", "BAYAN Worker Deploy"]
    types: [completed]
permissions:
  contents: read
jobs:
  production_guardian:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lightweight post-deploy health check
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
        run: node scripts/production-health.mjs
