name: BAYAN Lockfile Bootstrap

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bayan-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate lockfile only when missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "package-lock.json already exists; nothing to bootstrap."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked."
            exit 0
          fi
          test -s package-lock.json
          git config user.name "BAYAN Lockfile Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm lockfile for reproducible installs"
          git push origin HEAD:main
