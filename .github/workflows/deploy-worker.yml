name: BAYAN Worker Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_repair:
        description: 'Allow the explicit post-deploy production repair pass'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize the entire release, including post-deploy smoke and repair verification.
# A newer deployment must not replace the revision while the previous revision is being verified.
concurrency:
  group: bayan-production-release-v4
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Verify code and build
        run: npm run check
      - name: Inject commit-specific build ID
        run: node scripts/inject-build-id.mjs
      - name: Verify Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable production deployment."
            exit 1
          fi
      - name: Detect whether this release changes D1 migrations
        id: migration-check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # Manual releases reconcile pending migrations; ordinary pushes do so only
          # when migration files changed. This avoids burning D1 read quota on code-only releases.
          if [[ "$EVENT_NAME" != "push" || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- migrations_v1/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply remote D1 migrations
        if: steps.migration-check.outputs.changed == 'true'
        run: npx wrangler d1 migrations apply bayan-knowledge --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed commit identity
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_COMMIT_SHA;
          const endpoint = `${process.env.BAYAN_ORIGIN}/.well-known/build.json`;
          if (!/^[a-f0-9]{40}$/.test(expected || "")) throw new Error("GITHUB_SHA is not a full 40-character SHA");
          let last = "no response";
          for (let attempt = 1; attempt <= 30; attempt++) {
            try {
              const response = await fetch(endpoint, { cache: "no-store", headers: { "cache-control": "no-cache" } });
              const payload = await response.json();
              if (response.ok && payload.commit === expected) {
                console.log(`Verified deployed commit ${payload.commit}`);
                process.exit(0);
              }
              last = `HTTP ${response.status}; endpoint commit=${payload.commit ?? "missing"}; expected=${expected}`;
            } catch (error) { last = String(error); }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          throw new Error(`Deployed Worker commit identity mismatch after 30 attempts: ${last}`);
          NODE


  verify-production:
    # The workflow-level shared lock serializes deployment and all production smoke checks.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run read-only production smoke audit
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
        run: node scripts/production-smoke.mjs
      - name: Run explicitly authorized production repair
        if: github.event_name == 'workflow_dispatch' && inputs.allow_repair == true
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
          BAYAN_AI_MANAGER_TOKEN: ${{ secrets.BAYAN_AI_MANAGER_TOKEN }}
        run: node scripts/production-self-heal.mjs
      - name: Enforce post-deploy production health
        if: always()
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
        run: node scripts/production-health.mjs
      - name: Report news sitemap eligibility (non-blocking)
        if: always()
        env:
          BAYAN_PRODUCTION_URL: https://bayan.tahaomar411.workers.dev
        run: node scripts/news-sitemap-diagnostics.mjs
