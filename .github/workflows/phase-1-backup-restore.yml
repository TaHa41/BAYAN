name: BAYAN Phase 1 D1 backup and restore verification
on:
  push:
    branches: [repair/phase-1-backup-restore]
    paths:
      - ".github/workflows/phase-1-backup-restore.yml"
      - "scripts/phase-1-d1-backup-restore.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bayan-phase-1-d1-backup
  cancel-in-progress: false
jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_DB: bayan-knowledge
      TEST_DB: bayan-restore-test-${{ github.run_id }}
      BACKUP_FILE: ${{ runner.temp }}/bayan-knowledge.sql
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Validate credentials without printing values
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Export production D1
        run: npx wrangler d1 export "$SOURCE_DB" --remote --output="$BACKUP_FILE"
      - name: Validate dump and record baseline row counts
        run: node scripts/phase-1-d1-backup-restore.mjs baseline "$BACKUP_FILE" "$RUNNER_TEMP/baseline-counts.json"
      - name: Create isolated restore database
        run: npx wrangler d1 create "$TEST_DB"
      - name: Restore backup into isolated database
        run: npx wrangler d1 execute "$TEST_DB" --remote --file="$BACKUP_FILE"
      - name: Compare every table row count
        run: node scripts/phase-1-d1-backup-restore.mjs compare "$TEST_DB" "$RUNNER_TEMP/baseline-counts.json" "$RUNNER_TEMP/restore-counts.json"
      - name: Preserve backup and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayan-d1-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bayan-knowledge.sql
            ${{ runner.temp }}/baseline-counts.json
            ${{ runner.temp }}/restore-counts.json
          retention-days: 30
          if-no-files-found: warn
      - name: Delete isolated test database
        if: always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: npx wrangler d1 delete "$TEST_DB" --skip-confirmation
