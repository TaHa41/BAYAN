name: P0 Search Diagnostics CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/p0-search-provider-diagnostics-v2-20261015

permissions:
  contents: read

concurrency:
  group: p0-search-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, unit tests, source contracts, and Worker build
        run: npm run check
