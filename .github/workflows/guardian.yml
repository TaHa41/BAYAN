name: BAYAN Guardian

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["BAYAN CI", "BAYAN Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bayan-guardian
  cancel-in-progress: true

jobs:
  production:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: npm install

      - name: Production smoke diagnostics
        id: smoke
        continue-on-error: true
        env:
          BAYAN_URL: https://bayan.tahaomar411.workers.dev
        run: node scripts/production-smoke.mjs | tee smoke-report.txt

      - name: AI capability diagnostics
        id: ai
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          BAYAN_BASE_URL: https://bayan.tahaomar411.workers.dev
        run: node scripts/ai-capability-smoke.mjs | tee ai-report.txt

      - name: Create production incident
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}"             --title "BAYAN Guardian: production regression"             --body "Production smoke failed on ${{ github.sha }}. Review the Guardian run and production-smoke output." || true

      - name: Create AI quality incident
        if: steps.smoke.outcome == 'success' && steps.ai.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}"             --title "BAYAN Guardian: AI capability regression"             --body "AI capability benchmark failed on ${{ github.sha }}. The site smoke test remained healthy; review AI provider quality/capacity." || true

      - name: Guardian result
        if: steps.smoke.outcome == 'failure'
        run: exit 1
