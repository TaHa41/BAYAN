name: BAYAN Guardian

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["BAYAN Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bayan-guardian
  cancel-in-progress: true

jobs:
  production:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Production smoke diagnostics
        id: smoke
        continue-on-error: true
        env:
          BAYAN_URL: https://bayan.tahaomar411.workers.dev
        shell: bash
        run: node scripts/production-smoke.mjs | tee smoke-report.txt

      - name: AI capability diagnostics
        id: ai
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          BAYAN_BASE_URL: https://bayan.tahaomar411.workers.dev
        shell: bash
        run: |
          set +e
          node scripts/ai-capability-smoke.mjs | tee ai-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat ai-report.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: AI repair diagnosis
        id: diagnosis
        if: steps.smoke.outcome == 'failure' || steps.ai.outcome == 'failure'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-6-luna' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BAYAN Guardian diagnostic"
            echo "Commit: ${GITHUB_SHA}"
            echo "Smoke outcome: ${{ steps.smoke.outcome }}"
            echo "AI benchmark outcome: ${{ steps.ai.outcome }}"
            echo "--- production smoke ---"
            cat smoke-report.txt 2>/dev/null || true
            echo "--- AI benchmark ---"
            cat ai-report.txt 2>/dev/null || true
          } > diagnostic-input.txt
          DIAGNOSTIC_REPORT="$(cat diagnostic-input.txt)" node scripts/ai-guardian.mjs | tee ai-diagnosis.json

      - name: Create production incident
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIAGNOSIS="$(cat ai-diagnosis.json 2>/dev/null || true)"
          gh issue create --repo "${{ github.repository }}" --title "BAYAN Guardian: production regression" --body "$(printf 'Production smoke failed on %s.\n\n%s' "${{ github.sha }}" "$DIAGNOSIS")" || true

      - name: Create AI provider dependency incident
        if: steps.smoke.outcome == 'success' && steps.ai.outcome == 'failure' && contains(steps.ai.outputs.report, 'EXTERNAL_DEPENDENCY=AI_PROVIDER_QUOTA')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh issue list --repo "${{ github.repository }}" --state open --search "BAYAN Guardian: AI provider quota in:title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --repo "${{ github.repository }}" --title "BAYAN Guardian: AI provider quota" --body "$(printf 'The production site remained healthy, but AI providers are currently unavailable because of external quota/credit limits on %s.\n\n%s' "${{ github.sha }}" "$(cat ai-report.txt 2>/dev/null || true)")" || true
          fi

      - name: Create AI quality incident
        if: steps.smoke.outcome == 'success' && steps.ai.outcome == 'failure' && !contains(steps.ai.outputs.report, 'EXTERNAL_DEPENDENCY=AI_PROVIDER_QUOTA')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIAGNOSIS="$(cat ai-diagnosis.json 2>/dev/null || true)"
          gh issue create --repo "${{ github.repository }}" --title "BAYAN Guardian: AI capability regression" --body "$(printf 'AI capability benchmark failed on %s. The site smoke test remained healthy.\n\n%s' "${{ github.sha }}" "$DIAGNOSIS")" || true

      - name: Guardian result
        if: steps.smoke.outcome == 'failure'
        run: exit 1
