name: BAYAN AI Auto Repair

on:
  workflow_run:
    workflows: ["BAYAN Guardian"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: bayan-ai-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout failed production commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Download Guardian diagnostics
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} --repo "${{ github.repository }}" --name guardian-diagnostics --dir guardian-diagnostics || true

      - name: Autonomous repair
        id: repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-6-luna' }}
          BASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPAIR_REPORT: |
            BAYAN Guardian failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}.
            Workflow: ${{ github.event.workflow_run.html_url || 'manual run' }}
            Production diagnostics are in guardian-diagnostics/ when available.
            Inspect the repository and repair the confirmed production failure.
        run: |
          if [[ -d guardian-diagnostics ]]; then
            cat guardian-diagnostics/* 2>/dev/null > repair-input.txt || true
          fi
          REPAIR_REPORT="$(cat repair-input.txt 2>/dev/null || echo 'No Guardian artifact was available; inspect CI and production paths.')"
          export REPAIR_REPORT
          node scripts/ai-autorepair.mjs | tee ai-repair-result.json

      - name: Create repair pull request
        if: steps.repair.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.status)")"
          if [[ "$status" != "patched_and_verified" ]]; then
            echo "No verified patch was produced: $status"
            exit 0
          fi
          branch="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.branch)")"
          base_sha="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.baseSha)")"
          gh pr create --repo "${{ github.repository }}" --base main --head "$branch"             --title "fix(ai): autonomous verified repair for $base_sha"             --body "BAYAN AI produced a bounded patch for production commit $base_sha. Guards, typecheck, tests and build passed locally before this PR was opened. Normal CI/deploy/Guardian remains the production verification gate."

      - name: Run CI explicitly on repair branch
        if: steps.repair.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.branch)")"
          status="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.status)")"
          if [[ "$status" != "patched_and_verified" ]]; then
            exit 0
          fi
          gh workflow run "BAYAN CI" --repo "${{ github.repository }}" --ref "$branch"
          for i in {1..30}; do
            sleep 10
            run="$(gh run list --repo "${{ github.repository }}" --workflow "BAYAN CI" --branch "$branch" --limit 1 --json status,conclusion,databaseId --jq '.[0]')"
            current="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.status)' "$run")"
            conclusion="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.conclusion||"")' "$run")"
            echo "CI status=$current conclusion=$conclusion"
            if [[ "$current" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Remote CI failed."; exit 1; }
              break
            fi
            if [[ "$i" == "30" ]]; then
              echo "Remote CI timed out."; exit 1
            fi
          done

      - name: Merge only after CI success
        if: steps.repair.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.status)")"
          [[ "$status" == "patched_and_verified" ]] || exit 0
          branch="$(node -e "const x=require('./ai-repair-result.json'); console.log(x.branch)")"
          pr="$(gh pr list --repo "${{ github.repository }}" --head "$branch" --json number --jq '.[0].number')"
          if [[ -n "$pr" ]]; then
            gh pr merge "$pr" --repo "${{ github.repository }}" --squash --delete-branch
          else
            echo "Repair PR was not found."
            exit 1
          fi
