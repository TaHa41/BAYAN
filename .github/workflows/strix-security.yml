name: BAYAN Strix Security Review

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Strix scan depth"
        required: true
        type: choice
        options:
          - quick
          - standard
        default: quick

permissions:
  contents: read

jobs:
  strix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Strix
        run: python -m pip install --upgrade pipx && python -m pipx install strix-agent
      - name: Verify required secret exists
        env:
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$LLM_API_KEY" ]]; then
            echo "::error::Add STRIX_LLM_API_KEY in repository Actions secrets before manually running this security workflow."
            exit 1
          fi
      - name: Run bounded source-code security review
        env:
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          STRIX_LLM: ${{ vars.STRIX_LLM || 'openai/gpt-5.4' }}
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          strix --version
          strix -n --target ./ --scan-mode "$SCAN_MODE" --max-budget 10
      - name: Upload Strix report when generated
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bayan-strix-report
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14
