name: BAYAN Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public BAYAN page to audit
        required: true
        default: https://bayan.tahaomar411.workers.dev/
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate target
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          node --input-type=module <<'NODE'
          const u = new URL(process.env.TARGET_URL);
          if (u.protocol !== 'https:' || u.hostname !== 'bayan.tahaomar411.workers.dev') throw new Error('Only the BAYAN production origin is permitted');
          NODE
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ inputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 3
