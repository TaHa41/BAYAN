name: Production smoke monitor

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["BAYAN Worker Deploy"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  # Keep monitoring runs out of the deploy lock; the workflow_run trigger executes after deployment.
  group: bayan-production-smoke-v4
  cancel-in-progress: false

jobs:
  production-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify deployed BAYAN
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out monitoring scripts
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Wait until no production deployment is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-worker.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
            if [[ "$active" -eq 0 ]]; then
              echo "No active deployment; safe to run smoke tests."
              exit 0
            fi
            echo "A production deployment is active; waiting before smoke tests."
            sleep 10
          done
          echo "::error::Timed out waiting for the production deployment to finish."
          exit 1
      - name: Run full non-destructive production smoke on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
          BAYAN_SMOKE_SEARCH_PROBES: "1"
        run: node scripts/production-smoke.mjs
      - name: Run tagged search-only smoke after release
        if: github.event_name == 'workflow_run' && contains(github.event.workflow_run.head_commit.message, '[full-smoke]')
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
        run: node scripts/production-search-smoke.mjs
      - name: Run lightweight scheduled health check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && !contains(github.event.workflow_run.head_commit.message, '[full-smoke]'))
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
        run: node scripts/production-health.mjs
