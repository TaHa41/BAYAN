name: Production smoke monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: bayan-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Verify deployed BAYAN
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out monitoring scripts
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run deployed-site smoke tests
        env:
          BAYAN_ORIGIN: https://bayan.tahaomar411.workers.dev
          BAYAN_AI_MANAGER_TOKEN: ${{ secrets.BAYAN_AI_MANAGER_TOKEN }}
        run: node scripts/production-self-heal.mjs
